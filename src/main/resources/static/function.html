<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS OrgChart — Function</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1.0" />
  <link rel="shortcut icon" href="/favicon.svg?v=1.0" />
  <link rel="stylesheet" href="/css/tokens.css?v=3.0" />
  <link rel="stylesheet" href="/css/components.css?v=3.0" />
  <link rel="stylesheet" href="/css/style.css?v=3.3" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <a class="brand-logo brand-logo--placeholder" href="/" aria-label="KPMG, Central Services home">KPMG</a>
        <div class="header-divider"></div>
        <span class="header-title">Central Services</span>
      </div>
      <div class="header-right">
        <span class="header-sub">Organization Chart</span>
      </div>
    </div>
  </header>

  <!-- Function header -->
  <div class="func-header-bar">
    <div class="func-header-inner">
      <a href="/" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Back
      </a>
      <div class="func-header-info">
        <h1 class="func-page-title" id="funcTitle">Loading...</h1>
        <span class="func-page-count" id="funcCount"></span>
      </div>

      <div class="func-header-tools">
        <label class="func-search" for="funcSearch">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input id="funcSearch" type="search" placeholder="Find in this function" autocomplete="off" aria-label="Find a person in this function" />
          <span class="func-search-nav">
            <span class="func-search-count" id="funcSearchCount" aria-live="polite"></span>
            <button type="button" class="icon-btn" id="funcSearchPrev" aria-label="Previous match" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
            </button>
            <button type="button" class="icon-btn" id="funcSearchNext" aria-label="Next match" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </span>
        </label>

        <div class="view-toggle" role="group" aria-label="View">
          <button type="button" data-view="tree" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg>
            Tree
          </button>
          <button type="button" data-view="groups" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>
            Groups
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="main-content">
    <div id="faqBanner" class="faq-banner-container" style="display: none;"></div>
    <div id="orgChart">
      <!-- Rendered by JS -->
    </div>
  </main>

  <footer class="app-footer">
    <span>KPMG Central Services © 2026</span>
  </footer>

  <script src="/js/favicon.js"></script>
  <script src="/js/org-stream.js?v=3.0"></script>
  <script src="/js/ui.js?v=3.0"></script>
  <script src="/js/common.js?v=3.2"></script>
  <script src="/js/function.js?v=3.1"></script>
</body>
</html>
