<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS OrgChart - Central Services</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1.0" />
  <link rel="shortcut icon" href="/favicon.svg?v=1.0" />
  <link rel="stylesheet" href="/css/style.css?v=3.0" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="kpmg-logo">KPMG</div>
        <div class="header-divider"></div>
        <div>
          <div class="header-title">Central Services</div>
          <div class="header-subtitle">Organization Chart</div>
        </div>
      </div>
    </div>
  </header>

  <div class="search-bar">
    <div class="search-inner">
      <div class="search-wrap" id="searchWrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search by name, job title, group..."
          autocomplete="off"
          enterkeyhint="search"
          aria-label="Search employees"
          aria-describedby="searchHint"
        />
        <span class="search-spinner" id="searchSpinner" hidden aria-hidden="true"></span>
        <kbd class="search-kbd" id="searchKbd" title="Press / to search">/</kbd>
        <button class="search-clear" id="searchClear" type="button" hidden aria-label="Clear search">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <main class="main-content">
    <p class="search-hint" id="searchHint" hidden>Keep typing: search starts from 2 characters.</p>

    <section id="functionsSection">
      <div class="functions-orbit-shell">
        <div class="orbit-panel">
          <svg class="orbit-links" id="orbitLinks" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>

          <p class="orbit-headcount" id="centralCount" aria-live="polite">Loading…</p>

          <div class="central-node">
            <h1 class="central-node-title">Central Services</h1>
            <p class="central-node-copy" id="centralCopy">Departments</p>
          </div>

          <div class="func-orbit" id="funcOrbit"></div>
        </div>
      </div>
    </section>

    <section id="searchSection" class="search-section" hidden aria-labelledby="searchResultsMeta">
      <div class="search-filters" id="searchFilters" role="group" aria-label="Filter by function"></div>
      <div class="search-results-meta" id="searchResultsMeta" aria-live="polite"></div>
      <div class="search-results" id="searchResults"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span>KPMG Central Services © 2026</span>
  </footer>

  <script src="/js/favicon.js"></script>
  <script src="/js/org-stream.js?v=3.0"></script>
  <script src="/js/common.js?v=3.0"></script>
  <script src="/js/main.js?v=3.0"></script>
</body>
</html>
