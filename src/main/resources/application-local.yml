# Local development profile overrides.
# This file lives in src/main/resources and is loaded when spring.profiles.active=local.
#
# Key differences from production:
#   - DB URL without SSL (local PostgreSQL typically does not support SSL)
#   - Excel/photos paths point to the local project checkout

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:OrgStructure}?ssl=false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

app:
  data:
    excel-path: ${EXCEL_PATH:c:/Projects/OrgStructure/data/result_new.xlsx}
    photos-path: ${PHOTOS_PATH:c:/Projects/OrgStructure/photos}
