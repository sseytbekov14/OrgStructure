# No default profile: SPRING_PROFILES_ACTIVE=prod, stage or local must be given (StartupGuard refuses to start
# without it). See docs/SSO.md.
spring:
  application:
    name: cs-orgchart
  autoconfigure:
    exclude:
      # The accounts of the password form come from AUTH_PASSWORD_USERS (SecurityConfig), never Boot's default user
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      # Spring LDAP is used only by the AD sync, with its own connection (ad.ldap, AdConfig): no default LDAP
      # connection to localhost and no LDAP health check (it would query AD on every /actuator/health)
      - org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.ldap.LdapHealthContributorAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:OrgStructure}?ssl=true&sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  # The schema comes from the Flyway migrations (db/migration); Hibernate only checks that it fits the entities.
  # A database made before Flyway (by ddl-auto: update) already has the tables of V1: it is marked as version 1
  # on the first start and gets only the later migrations.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  # Whether to trust X-Forwarded-* (scheme, host, client address) from an HTTP proxy in front of the app. On the
  # server there is none: a TCP port forward (netsh portproxy 443 -> 8082) and TLS ends in the app itself
  # (server.ssl), so the request already carries the real scheme and host, and the headers must not be trusted
  # (anyone could send them). native (or framework) only behind a reverse proxy that ends TLS (docs/SSO.md).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      # Signed out after this long without a request (every request starts it again)
      timeout: ${SESSION_TIMEOUT:8h}
      # The session cookie (SameSite, Secure, HttpOnly) follows the sign-in mode: SessionCookieDefaults

app:
  # Where the employees of the site come from (EmployeeSourceProperties, spec section 8): excel (the Excel file) or db
  # (the employees synced from AD); back to excel is the rollback. The tree parent: pm or manager, the other one is
  # the fallback.
  employees:
    source: ${EMPLOYEE_SOURCE:excel}
    parent-source: ${ORG_PARENT_SOURCE:pm}
  # One-off import of group, heads and texts from the Excel file (app.data.excel-path) into employee_overrides
  # (OverridesImportProperties, spec section 13 Phase 5c)
  overrides-import:
    from-excel: ${OVERRIDES_IMPORT_FROM_EXCEL:false}
    dry-run: ${OVERRIDES_IMPORT_DRY_RUN:false}
    report-path: ${OVERRIDES_IMPORT_REPORT_PATH:logs/overrides-import-report.json}
    max-manager-override-ratio: ${OVERRIDES_IMPORT_MAX_MANAGER_OVERRIDE_RATIO:0.10}
  # Employee photos from AD thumbnailPhoto (PhotoProperties): only with EMPLOYEE_SOURCE=db. Stored in the database
  # (employee_photos), served by GET /api/photos/{id}; the photo folder below stays the fallback, the initials the last
  # resort.
  photos:
    ad-enabled: ${AD_PHOTOS_ENABLED:false}
    source-priority: ${PHOTO_SOURCE_PRIORITY:ad,folder}
    max-bytes: ${AD_PHOTOS_MAX_BYTES:204800}
    max-side: ${AD_PHOTOS_MAX_SIDE:4096}
    time-budget: ${AD_PHOTOS_TIME_BUDGET:120s}
  data:
    excel-path: c:/Projects/OrgStructure/data/result_new.xlsx
    photos-path: c:/Projects/OrgStructure/photos
  # Requests for an alias host (comma-separated, any case) are redirected to the same address on the canonical
  # host before sign-in (CanonicalHostFilter, docs/SSO.md); empty: off. Status 302 or 301.
  canonical-host: ${APP_CANONICAL_HOST:}
  alias-hosts: ${APP_ALIAS_HOSTS:}
  alias-redirect-status: ${APP_ALIAS_REDIRECT_STATUS:302}

# How people get in (AuthMode): AUTH_SSO_ENABLED=true - sign-in with Microsoft Entra ID (SAML);
# AUTH_SSO_ENABLED=false - open to everyone without sign-in (as before SSO), or the password form when
# AUTH_PASSWORD_ENABLED=true. The profiles give their own defaults (prod: SSO; stage and local: open).
auth:
  sso:
    enabled: ${AUTH_SSO_ENABLED:false}
    # SAML 2.0 with Microsoft Entra ID (SamlConfig), read only with SSO on, no defaults: the Identifier of the
    # Entra application, its Reply URL (https://<site>/login/saml2/sso/entra) and its App Federation Metadata Url
    entity-id: ${SAML_ENTITY_ID:}
    acs-url: ${SAML_ACS_URL:}
    metadata-uri: ${SAML_METADATA_URI:}
    # Optional: only addresses of these domains (comma-separated, any case); empty: everyone Entra lets through
    allowed-email-domains: ${SAML_ALLOWED_EMAIL_DOMAINS:}
    # GET /me: the signed-in person's own SAML claims, for checking the claims of the Entra application;
    # off by default, switch it on only for the check
    debug-endpoint: ${AUTH_SSO_DEBUG_ENDPOINT:false}
  password:
    # Emergency sign-in instead of the open site (only with SSO off); off unless asked for
    enabled: ${AUTH_PASSWORD_ENABLED:false}
    # Emergency accounts of the password form: name:bcrypt-hash[,name:bcrypt-hash...]
    users: ${AUTH_PASSWORD_USERS:}
  # /logout; empty: on only with the password form
  logout:
    enabled: ${AUTH_LOGOUT_ENABLED:}
  # Everyone signed in is USER; these addresses (e-mail or UPN, or the password account name) get more
  roles:
    system-admin-emails: ${SYSTEM_ADMIN_EMAILS:}
    hr-editor-emails: ${HR_EDITOR_EMAILS:}

# Employees from Active Directory (docs/OrgChart_AD_Integration_Spec_v3.md, section 8). AD_SYNC_MODE empty: no AD
# components at all. Nothing connects to AD at start: the first connection is made by the first sync.
ad:
  sync:
    enabled: ${AD_SYNC_ENABLED:false}
    # mock (synthetic users of mock/ad-employees.json) | ldap
    mode: ${AD_SYNC_MODE:}
    # "-" disables the scheduler
    cron: "${AD_SYNC_CRON:0 */30 * * * *}"
    on-startup: ${AD_SYNC_ON_STARTUP:false}
    # A dry run once at startup (nothing written to the database), its report (counts only) to report-path
    startup-dry-run: ${AD_SYNC_STARTUP_DRY_RUN:false}
    report-path: ${AD_SYNC_REPORT_PATH:logs/ad-sync-report.json}
    min-ratio: ${AD_SYNC_MIN_RATIO:0.5}
  ldap:
    # ldaps:// only; the certificate is checked against AD_LDAP_TRUSTSTORE_PATH, for this connection only
    url: ${AD_LDAP_URL:}
    base-dn: ${AD_LDAP_BASE_DN:}
    bind-dn: ${AD_LDAP_BIND_DN:}
    bind-password: ${AD_LDAP_BIND_PASSWORD:}
    # empty: Central Services users with enabled accounts, without copilot-* (AdLdapProperties.DEFAULT_FILTER,
    # spec section 4.2)
    filter: ${AD_LDAP_FILTER:}
    page-size: ${AD_LDAP_PAGE_SIZE:500}
    # Country OUs (OU=<XX>,OU=Countries) whose employees are synced; records of other OUs are skipped (section 4.4)
    countries: ${AD_LDAP_COUNTRIES:KZ,UZ,AZ,GE,AM,KG}
    truststore-path: ${AD_LDAP_TRUSTSTORE_PATH:}
    truststore-password: ${AD_LDAP_TRUSTSTORE_PASSWORD:}
    # Connecting to the domain controller, and waiting for each answer (a page of 500 entries can take a while)
    connect-timeout: ${AD_LDAP_CONNECT_TIMEOUT:10s}
    read-timeout: ${AD_LDAP_READ_TIMEOUT:180s}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: when_authorized
      roles: "SYSTEM_ADMIN"
      # The AD sync health (AdSyncHealthIndicator) is never DOWN: a stale or switched-off AD sync keeps
      # /actuator/health at 200, the site serves the employees it has
      status:
        http-mapping:
          STALE: 200
          DISABLED: 200
    env:
      enabled: false
    heapdump:
      enabled: false
