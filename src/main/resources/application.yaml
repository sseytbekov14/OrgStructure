spring:
  profiles:
    active: local
  application:
    name: cs-orgchart
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:OrgStructure}?ssl=true&sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # Переключить в true на PROD после подключения HTTPS
        same-site: strict

app:
  data:
    excel-path: c:/Projects/OrgStructure/data/result_new.xlsx
    photos-path: c:/Projects/OrgStructure/photos

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: when_authorized
      roles: "SYSTEM_ADMIN"
    env:
      enabled: false
    heapdump:
      enabled: false
