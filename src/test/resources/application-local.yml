# Test-only overrides for the "local" Spring profile.
#
# OAuth2ClientProperties.afterPropertiesSet() validates that client-id is non-empty.
# In CI the SSO_CLIENT_ID / SSO_CLIENT_SECRET env vars are absent, so
# application.yaml resolves them to empty strings, which fails validation.
# This file (src/test/resources only) supplies harmless dummy values so the
# Spring context can start without real IdP credentials.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:OrgStructure}?ssl=false
    
  security:
    oauth2:
      client:
        registration:
          corporate-sso:
            client-id: test-client-id
            client-secret: test-client-secret
        provider:
          corporate-sso:
            issuer-uri: https://test.example.com

# Increase file watcher interval so it does not interfere with test teardown
app:
  data:
    watch-interval-ms: 3600000
